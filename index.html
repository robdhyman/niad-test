<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NIAD Test">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>NIAD Test</title>
<style>
:root {
  --bg: #f4f2ee; --surface: #ffffff; --surface-2: #ebe8e2; --text: #1b1c1f; --muted: #6a6c72;
  --line: #d9d5cd; --accent: #c4501b; --accent-ink: #ffffff; --good: #2f7d4f; --warn: #a86a00; --bad: #b3261e;
  --radius: 14px; --tap: 52px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --surface: #1e2126; --surface-2: #2a2e35; --text: #eceae6; --muted: #9a9ca3;
    --line: #343941; --accent: #f07a3e; --accent-ink: #1b0d05; --good: #5cc488; --warn: #e2a63b; --bad: #f2786d;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* Header */
.top {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(10px + env(safe-area-inset-top)) 0 10px; border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.total { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.total small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.clock { text-align: right; font-variant-numeric: tabular-nums; }
.clock b { display: block; font-size: 22px; }
.clock span { font-size: 13px; color: var(--muted); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.wait { background: var(--warn); } .dot.err { background: var(--bad); }
.tierbar { margin-top: 8px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.tierbar i { display: block; height: 100%; background: var(--accent); }
.tiernote { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Segments */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 14px 0; }
.seg button { height: 40px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }

/* Grids */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile {
  min-height: 74px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.tile:active { transform: scale(0.97); }
.tile b { font-size: 22px; }
.tile { position: relative; }
.tile.used { border-color: var(--accent); }
.ltr { font-style: normal; font-size: 11px; font-weight: 800; color: var(--muted); }
.tile .ltr { position: absolute; top: 6px; left: 8px; }
.tile.used .ltr { color: var(--accent); }
.ltr.inline { display: inline-block; min-width: 22px; padding: 1px 4px; margin-right: 6px; border-radius: 6px; background: var(--surface-2); text-align: center; }
.ltr.inline.on { background: var(--accent); color: var(--accent-ink); }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
.rowcell { border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; text-align: center; color: var(--muted); }
.rowcell b { display: block; font-size: 16px; }
.rowcell span { display: block; font-size: 10px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowcell.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tile span { font-size: 12px; color: var(--muted); }
.tile em { font-style: normal; font-size: 12px; color: var(--accent); font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 8px; font-size: 15px; }
.muted { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--accent); }

/* Exercises */
.ex { padding: 12px 0; border-top: 1px solid var(--line); }
.ex:first-child { border-top: 0; padding-top: 0; }
.ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ex-head b { font-size: 16px; }
.ex-head .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
.ex-actions { display: flex; gap: 8px; margin-top: 8px; }
.chip { height: 44px; min-width: 56px; padding: 0 12px; border-radius: 12px; background: var(--surface-2); font-weight: 700; }
.chip:active { background: var(--line); }
.num { width: 76px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; font-size: 16px; }

/* Buttons */
.btn { width: 100%; height: var(--tap); border-radius: var(--radius); font-weight: 700; font-size: 17px; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn + .btn { margin-top: 10px; }
.btn:disabled { opacity: 0.5; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface);
  border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  max-height: 88vh; overflow-y: auto; max-width: 560px; margin: 0 auto;
}
.sheet h2 { margin: 0 0 4px; font-size: 22px; }
.label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; text-align: left; }
.pick[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.pick small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.falls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.falls .pick { text-align: center; }
.text { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; }
.gain { font-size: 34px; font-weight: 800; color: var(--accent); margin: 16px 0 12px; text-align: center; }

/* Tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom);
}
.tabs button { height: 60px; font-size: 13px; font-weight: 700; color: var(--muted); }
.tabs button[aria-current="page"] { color: var(--accent); }

/* Toast */
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 15;
  max-width: 528px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 12px;
  padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600;
}
.toast button { color: var(--accent); font-weight: 800; }

/* Ladder */
.tier { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.tier:first-of-type { border-top: 0; }
.tier .badge { width: 64px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tier.locked { opacity: 0.45; }
.ok { color: var(--good); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
ol.steps { padding-left: 20px; margin: 8px 0 0; font-size: 14px; }
ol.steps li { margin-bottom: 6px; }
a { color: var(--accent); }
h1 { font-size: 26px; margin: 18px 0 12px; }
.empty { text-align: center; padding: 28px 0 8px; }
.empty p { color: var(--muted); }
.kind { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.check { display: flex; align-items: center; gap: 10px; min-height: var(--tap); font-size: 17px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.err { color: var(--bad); }
/* Points tab */
.flow { display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.fbox { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 700; background: var(--bg); }
.fbox small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.fbox.bonus { border-color: var(--accent); }
.fbox.total-box { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fbox.total-box small { color: inherit; opacity: 0.85; }
.fop { text-align: center; font-weight: 800; color: var(--muted); line-height: 1; }
table.rubric { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.rubric th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 700; padding: 4px 4px 6px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
.rubric td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rubric tr:last-child td { border-bottom: 0; }
.rubric .ltrc { font-weight: 800; color: var(--accent); width: 30px; }
.rubric .bar { display: block; height: 3px; border-radius: 2px; background: var(--accent); opacity: 0.5; margin-top: 4px; }
ul.rules { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
ul.rules li { margin-bottom: 4px; }
.bchips { display: flex; flex-wrap: wrap; gap: 6px; }
.bchip { font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; color: var(--muted); }
.bchip b { color: var(--text); }
.bchip em { font-style: normal; font-weight: 800; color: var(--accent); margin-left: 4px; }
.ladderdiag { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin: 6px 0 10px; }
.rung { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.rung i { display: block; width: 100%; height: var(--h); background: color-mix(in srgb, var(--accent) 70%, transparent); border-radius: 8px 8px 0 0; }
.rung b { font-size: 13px; margin-top: 4px; }
.rung small { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
